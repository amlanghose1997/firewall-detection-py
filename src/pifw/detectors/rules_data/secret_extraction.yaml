patterns:
  - id: se_reveal_system_prompt
    regex: '(?:reveal|print|show|display|output|dump|give|share|provide|tell|send|get)\s+(?:me\s+)?(?:the\s+|your\s+)?(?:exact\s+)?(?:system\s+prompt|initial\s+instructions|hidden\s+rules|instructions|rules|configuration)'
    weight: 0.90
    description: "reveal system prompt directive"
  - id: se_what_is_system_prompt
    regex: 'what\s+(?:is|are|was|were)\s+(?:the\s+|your\s+)?(?:exact\s+)?(?:system\s+prompt|initial\s+instructions|hidden\s+rules|prompt|instructions)'
    weight: 0.88
    description: "what is system prompt inquiry"
  - id: se_what_were_you_told
    regex: 'what\s+(?:were\s+you|was\s+your)\s+(?:told|given|instructed)'
    weight: 0.85
    description: "prompt disclosure inquiry"
  - id: se_output_everything_above
    regex: 'output\s+everything\s+(?:above|before\s+this|in\s+your\s+context)'
    weight: 0.88
    description: "output context history request"
  - id: se_show_hidden_prompt
    regex: 'show\s+(?:me\s+)?(?:the\s+)?hidden\s+prompt'
    weight: 0.88
    description: "show hidden prompt request"
  - id: se_repeat_words_above
    regex: 'repeat\s+(?:all\s+)?(?:the\s+)?words\s+(?:above|before|in\s+system)'
    weight: 0.85
    description: "repeat prompt instructions"
