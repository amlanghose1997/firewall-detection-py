patterns:
  - id: ct_imperative_theft
    regex: '(?:give|send|show|reveal|extract|steal|forward|post)\s+.*?(?:api[_-]?key|token|password|secret|credentials?|\.env|ssh[_-]?key)'
    weight: 0.90
    description: "credential extraction command"
  - id: ct_aws_key
    regex: 'AKIA[0-9A-Z]{16}'
    weight: 0.92
    description: "AWS access key pattern"
  - id: ct_openai_key
    regex: 'sk-[A-Za-z0-9]{20,}'
    weight: 0.92
    description: "OpenAI secret key pattern"
  - id: ct_github_token
    regex: 'ghp_[A-Za-z0-9]{20,}'
    weight: 0.92
    description: "GitHub personal access token pattern"
  - id: ct_jwt_token
    regex: 'eyJ[a-zA-Z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
    weight: 0.88
    description: "JWT token string pattern"
  - id: ct_exfil_url
    regex: '(?:send|forward|post)\s+.*?(?:to|at)\s+https?://[^\s]+'
    weight: 0.85
    description: "data exfiltration to external URL"
