patterns:
  - id: ta_call_tool_explicit
    regex: 'call\s+(?:the\s+)?(?:send_email|delete|transfer|execute|run|exec|eval)\s+tool'
    weight: 0.85
    description: "explicit tool invocation directive"
  - id: ta_shell_abuse
    regex: 'bash\s+-c|curl\s+https?://|rm\s+-rf|powershell\s+-enc|cmd\.exe\s+/c'
    weight: 0.90
    description: "shell command execution payload"
  - id: ta_forged_tool_call
    regex: '\{\s*\"tool\"\s*:\s*\"|<tool>|<call>|tool_call\s*:'
    weight: 0.85
    description: "forged tool call format injection"
  - id: ta_path_traversal
    regex: '\.\./\.\./|\.\.\\\.\.\\|/etc/passwd|C:\\Windows\\System32'
    weight: 0.88
    description: "path traversal or system directory reference"
  - id: ta_ssrf_targets
    regex: '169\.254\.169\.254|localhost:|\b127\.0\.0\.1:'
    weight: 0.88
    description: "SSRF target address in command"
