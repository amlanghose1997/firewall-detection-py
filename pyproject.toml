[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pifw"
version = "0.1.0"
description = "Prompt Injection Firewall (pifw)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ET AI Hackathon" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["transformers>=4.41", "torch>=2.2"]
proxy = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
demo = ["streamlit>=1.36"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]